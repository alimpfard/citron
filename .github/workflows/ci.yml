name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libbsd-dev \
            libffi-dev \
            libgc-dev \
            libpcre3-dev \
            libsparsehash-dev

      - name: Build
        run: make

      - name: Test
        env:
          CITRON_EXT_PATH: ${{ github.workspace }}
        run: bash ./runtests.sh
